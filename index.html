<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sogon-Luce | 三维展厅</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ================== 首页选择界面 ================== */
    #landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 100%);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #landing.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #landingTitle {
      font-size: 14px;
      letter-spacing: 6px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    #landingBrand {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 8px;
      margin-bottom: 60px;
      color: #fff;
    }

    #landingBrand span {
      font-weight: 500;
      color: #e8c47a;
    }

    #sceneSelector {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 24px;
    }

    .sceneCard {
      width: 320px;
      height: 420px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .sceneCard:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .sceneThumb {
      flex: 1;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .sceneThumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 10, 0.9) 0%, transparent 50%);
    }

    .sceneInfo {
      padding: 20px 24px 24px;
      position: relative;
      z-index: 2;
    }

    .sceneTag {
      font-size: 11px;
      color: #e8c47a;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sceneName {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .sceneDesc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.5;
    }

    .enterBtn {
      margin-top: 16px;
      padding: 8px 0;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      transition: all 0.3s;
    }

    .sceneCard:hover .enterBtn {
      border-color: #e8c47a;
      color: #e8c47a;
      background: rgba(232, 196, 122, 0.08);
    }

    /* ================== Three.js 场景 ================== */
    #sceneContainer {
      position: fixed;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #sceneContainer.active {
      opacity: 1;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* 导航栏 */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.5s ease 0.3s;
    }

    #navbar.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #backHome {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s;
      border: none;
      background: none;
    }

    #backHome:hover {
      color: #fff;
    }

    #brand {
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    #navTabs {
      display: flex;
      gap: 8px;
    }

    .navTab {
      padding: 6px 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.5);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .navTab:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.05);
    }

    .navTab.active {
      border-color: #e8c47a;
      color: #e8c47a;
      background: rgba(232, 196, 122, 0.08);
    }

    /* 底部控制 */
    #tourBtn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: 0.3s;
      z-index: 100;
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.5s ease 0.5s;
    }

    #tourBtn.visible {
      opacity: 1;
    }

    #tourBtn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    #controlsHint {
      position: fixed;
      bottom: 24px;
      left: 24px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      letter-spacing: 0.5px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.5s ease 0.6s;
    }

    #controlsHint.visible {
      opacity: 1;
    }

    /* Loading */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 14px;
      letter-spacing: 2px;
      display: none;
      z-index: 1500;
      background: rgba(0, 0, 0, 0.7);
      padding: 16px 32px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 信息卡片 */
    #card {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      background: rgba(15, 15, 15, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      color: #fff;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
      z-index: 999;
    }

    #closeCard {
      cursor: pointer;
      font-size: 22px;
      opacity: 0.5;
      float: right;
      line-height: 1;
      transition: opacity 0.2s;
    }

    #closeCard:hover {
      opacity: 1;
    }
  </style>
</head>

<body>
  <!-- ================== 首页选择 ================== -->
  <div id="landing">
    <div id="landingTitle">Spatial Experience Design</div>
    <div id="landingBrand">Sogon<span>.</span>Luce</div>

    <div id="sceneSelector">
      <div class="sceneCard" data-scene="showroom">
        <div class="sceneThumb"
          style="background-image: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=600&h=800&fit=crop')">
        </div>
        <div class="sceneInfo">
          <div class="sceneTag">Luxury Showroom</div>
          <div class="sceneName">轻奢展厅</div>
          <div class="sceneDesc">现代轻奢风格产品陈列空间，金属质感与暖光交织</div>
          <div class="enterBtn">点击进入展厅</div>
        </div>
      </div>

      <div class="sceneCard" data-scene="piano">
        <div class="sceneThumb" style="background-image: url('./fengmian/qinfang.jpg')">
        </div>
        <div class="sceneInfo">
          <div class="sceneTag">Wabi-Sabi</div>
          <div class="sceneName">日式侘寂琴房</div>
          <div class="sceneDesc">枯木、碎石、暗光，一个人的琴房与庭院</div>
          <div class="enterBtn">点击进入琴房</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================== Three.js 场景 ================== -->
  <div id="sceneContainer">
    <div id="navbar">
      <button id="backHome">&#8592; 返回首页</button>
      <div id="brand">Sogon.Luce</div>
      <div id="navTabs">
        <button class="navTab" data-scene="showroom">轻奢展厅</button>
        <button class="navTab" data-scene="piano">日式琴房</button>
      </div>
    </div>

    <div id="loading">场景加载中...</div>

    <div id="card">
      <span id="closeCard">&times;</span>
      <h3 id="cardTitle" style="margin:0 0 12px;font-size:18px;font-weight:500;">产品名称</h3>
      <p id="cardDesc" style="margin:0 0 12px;font-size:14px;line-height:1.6;color:rgba(255,255,255,0.65)">产品描述</p>
      <div id="cardPrice" style="font-size:16px;font-weight:600;color:#e8c47a">参考价: ¥299</div>
    </div>

    <button id="tourBtn">开启自动巡游</button>
    <div id="controlsHint">鼠标左键旋转 / 滚轮缩放 / 右键平移</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ================== 场景配置 ==================
    const sceneConfigs = {
      showroom: {
        file: 'showroom.glb',
        cameraPos: [0, 1.5, 1],
        lookAt: [0, 1.2, 0],
        exposure: 0.25,
        bloomStrength: 0.15,
        envIntensity: 0.3,
        bgColor: 0x222222,
        fogColor: 0x222222,
        fogDensity: 0.02,
        exhibits: {
          'bronze': { title: '鲨鱼雕像', desc: '采用高质量材质制作，放置在展厅的中心位置。', price: '¥299' },
          'watch': { title: '魔法怀表', desc: '可以穿越时间的怀表', price: '¥？？？' },
          'book': { title: '古老的书', desc: '一本充满神秘力量的古老书籍', price: '¥？？？' },
          'pingan': { title: '平安扣摆件', desc: '保佑平安的护身扣', price: '¥129' },
          'pan': { title: '精致陶瓷釉盘套件', desc: '用于放置物品或菜品的精美盘子', price: '¥29' },
          'cylinder003': { title: '精美陶瓷茶壶', desc: '用于泡茶的精美茶壶', price: '¥49' },
          'box': { title: '茶叶盒', desc: '存放着各种茶叶的盒子', price: '¥39' },
          'potion': { title: '魔法药水瓶', desc: '装有神秘魔法药水的瓶子', price: '¥ ? ? ?' },
          'whisky': { title: '威士忌酒', desc: '陈年威士忌，口感醇厚', price: '¥599' },
          'wine': { title: '红酒', desc: '精选葡萄酿造的红酒，适合搭配美食', price: '¥399' },
          'beer': { title: '精酿啤酒', desc: '采用优质麦芽和啤酒花酿造的精酿啤酒', price: '¥29' }
        },
        glowObjects: ['Cylinder004'],
        glowColor: 0xFFD36E,
        glowIntensity: 3.0,
        tourPoints: [
          new THREE.Vector3(0, 1.5, 10), new THREE.Vector3(0, 1.5, 5),
          new THREE.Vector3(0, 1.5, 1), new THREE.Vector3(-2, 1.5, 0),
          new THREE.Vector3(0, 1.5, -2.5), new THREE.Vector3(2.5, 1.5, -2.5),
          new THREE.Vector3(2.5, 1.5, -1), new THREE.Vector3(0, 1.5, 0)
        ]
      },
      piano: {
        file: 'piano_room.glb',
        cameraPos: [0, 1.8, 6],
        lookAt: [-3, 1.0, 0],
        exposure: 0.5,
        bloomStrength: 0.08,
        envIntensity: 0.15,
        bgColor: 0x0a0a0a,
        fogColor: 0x0a0a0a,
        fogDensity: 0.03,
        exhibits: {
          'piano': { title: '三角钢琴', desc: '黑色三角钢琴，侘寂琴房的核心', price: '定制' },
          'tree': { title: '庭院枯木', desc: '象征时间流逝的枯木', price: '定制' },
          'cushion': { title: '剑麻坐垫', desc: '手工编织天然剑麻坐垫', price: '¥199' },
          'teapot': { title: '粗陶茶壶', desc: '侘寂风粗陶茶具', price: '¥299' },
          'branch': { title: '枯枝', desc: '陶罐中的枯枝插花', price: '¥159' }
        },
        glowObjects: [],
        glowColor: 0xFFD36E,
        glowIntensity: 2.0,
        tourPoints: [
          new THREE.Vector3(0, 1.8, 6), new THREE.Vector3(0, 1.8, 2),
          new THREE.Vector3(0, 1.2, 1), new THREE.Vector3(-2, 1.2, 0),
          new THREE.Vector3(0, 1.5, -2), new THREE.Vector3(3, 1.8, -1)
        ]
      }
    };

    // ================== 全局变量 ==================
    let currentSceneKey = null;
    let currentConfig = null;
    let scene, camera, renderer, composer, controls, bloomPass;
    let currentModel = null;
    let currentCurve = null;
    let isTouring = false;
    let tourProgress = 0;
    let selectedMesh = null;
    let originalEmissive = new THREE.Color(0, 0, 0);
    let animId = null;
    let isSceneActive = false;

    // ================== 初始化 Three.js ==================
    function initThree() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.getElementById('sceneContainer').appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 1.8;
      controls.minDistance = 0.5;
      controls.maxDistance = 15;

      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.1, 0.4, 0.85
      );
      composer.addPass(bloomPass);

      // 环境贴图
      const rgbeLoader = new RGBELoader();
      rgbeLoader.load('studio_small_09_1k.hdr', (texture) => {
        texture.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = texture;
      });

      window.addEventListener('resize', onResize);
    }

    function setupLights() {
      scene.children.filter(c => c.isLight).forEach(l => scene.remove(l));

      const ambient = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambient);

      const dir = new THREE.DirectionalLight(0xffe5cc, 0.5);
      dir.position.set(5, 8, 5);
      scene.add(dir);

      if (currentSceneKey === 'piano') {
        const warm = new THREE.PointLight(0xFFD36E, 2, 8);
        warm.position.set(0, 2.5, 0);
        scene.add(warm);
      }
    }

    // ================== 加载场景 ==================
    function loadScene(key) {
      if (currentSceneKey === key && currentModel) return;

      currentSceneKey = key;
      currentConfig = sceneConfigs[key];

      // UI
      document.querySelectorAll('.navTab').forEach(t => t.classList.toggle('active', t.dataset.scene === key));
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = '场景加载中...';
      document.getElementById('card').style.display = 'none';
      if (selectedMesh) {
        selectedMesh.material?.emissive?.copy(originalEmissive);
        selectedMesh = null;
      }

      // 清理旧模型
      if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse(child => {
          if (child.isMesh) {
            child.geometry?.dispose();
            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
            else child.material?.dispose();
          }
        });
        currentModel = null;
      }

      // 场景参数
      scene.background = new THREE.Color(currentConfig.bgColor);
      scene.fog = new THREE.FogExp2(currentConfig.fogColor, currentConfig.fogDensity);
      renderer.toneMappingExposure = currentConfig.exposure;
      bloomPass.strength = currentConfig.bloomStrength;
      if (scene.environment) scene.environmentIntensity = currentConfig.envIntensity;

      camera.position.set(...currentConfig.cameraPos);
      controls.target.set(...currentConfig.lookAt);
      controls.update();

      setupLights();

      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
      loader.setDRACOLoader(draco);

      loader.load(currentConfig.file, (gltf) => {
        currentModel = gltf.scene;
        scene.add(currentModel);

        currentCurve = new THREE.CatmullRomCurve3(currentConfig.tourPoints);
        currentCurve.closed = true;

        currentModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            const name = child.name.toLowerCase();
            for (const gName of currentConfig.glowObjects) {
              if (name.includes(gName.toLowerCase()) && child.material) {
                child.material.emissive = new THREE.Color(currentConfig.glowColor);
                child.material.emissiveIntensity = currentConfig.glowIntensity;
              }
            }

            for (const eKey in currentConfig.exhibits) {
              if (name.includes(eKey.toLowerCase())) {
                child.userData.isExhibit = true;
                child.userData.info = currentConfig.exhibits[eKey];
                break;
              }
            }
          }
        });

        document.getElementById('loading').style.display = 'none';
        console.log(`${key} 加载完成`);

      }, (xhr) => {
        const pct = xhr.total ? (xhr.loaded / xhr.total * 100).toFixed(0) : '?';
        document.getElementById('loading').textContent = `加载中... ${pct}%`;
      }, (err) => {
        console.error('加载失败:', err);
        document.getElementById('loading').textContent = '加载失败，请检查文件';
      });
    }

    // ================== 交互 ==================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function onClick(event) {
      if (!isSceneActive || isTouring) return;
      if (event.target.closest('#navbar, #card, #tourBtn')) return;

      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      let hit = null;
      for (let i = 0; i < intersects.length; i++) {
        if (intersects[i].object.userData.isExhibit) {
          hit = intersects[i].object;
          break;
        }
      }

      if (selectedMesh && selectedMesh.material?.emissive) {
        selectedMesh.material.emissive.copy(originalEmissive);
      }

      if (hit) {
        selectedMesh = hit;
        if (hit.material?.emissive) {
          originalEmissive.copy(hit.material.emissive);
          hit.material.emissive.set(0x444444);
        }
        const info = hit.userData.info;
        document.getElementById('cardTitle').textContent = info.title;
        document.getElementById('cardDesc').textContent = info.desc;
        document.getElementById('cardPrice').textContent = `参考价: ${info.price}`;
        document.getElementById('card').style.display = 'block';
      } else {
        selectedMesh = null;
        document.getElementById('card').style.display = 'none';
      }
    }

    window.addEventListener('click', onClick);

    document.getElementById('closeCard').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('card').style.display = 'none';
      if (selectedMesh?.material?.emissive) {
        selectedMesh.material.emissive.copy(originalEmissive);
        selectedMesh = null;
      }
    });

    // 导航切换
    document.querySelectorAll('.navTab').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.scene === currentSceneKey) return;
        loadScene(btn.dataset.scene);
      });
    });

    // 巡游
    document.getElementById('tourBtn').addEventListener('click', () => {
      isTouring = !isTouring;
      document.getElementById('tourBtn').textContent = isTouring ? '关闭自动巡游' : '开启自动巡游';
      controls.enabled = !isTouring;
    });

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    // ================== 动画循环（修复版）====================
    function animate() {
      animId = requestAnimationFrame(animate);

      if (!isSceneActive) return;

      // 巡游
      if (isTouring && currentCurve) {
        tourProgress += 0.0005;
        tourProgress %= 1;
        const pts = currentCurve.getSpacedPoints(2000);
        const idx = Math.floor(tourProgress * (pts.length - 1));
        const current = pts[idx];
        const target = pts[(idx + 50) % pts.length];
        camera.position.copy(current);
        camera.lookAt(target);
      }

      // 【修复核心】每帧都必须 update controls，不管有没有交互
      controls.update();

      // 每帧都渲染——修复"拖动后几秒不动"的问题
      composer.render();
    }

    // ================== 首页逻辑 ==================
    function enterScene(key) {
      document.getElementById('landing').classList.add('hidden');
      document.getElementById('sceneContainer').classList.add('active');
      document.getElementById('navbar').classList.add('visible');
      document.getElementById('tourBtn').classList.add('visible');
      document.getElementById('controlsHint').classList.add('visible');

      isSceneActive = true;

      if (!renderer) {
        initThree();
        animate();
      }

      loadScene(key);
    }

    function backToHome() {
      document.getElementById('landing').classList.remove('hidden');
      document.getElementById('sceneContainer').classList.remove('active');
      document.getElementById('navbar').classList.remove('visible');
      document.getElementById('tourBtn').classList.remove('visible');
      document.getElementById('controlsHint').classList.remove('visible');
      isSceneActive = false;
      isTouring = false;
      document.getElementById('tourBtn').textContent = '开启自动巡游';
      controls.enabled = true;
    }

    // 首页卡片点击
    document.querySelectorAll('.sceneCard').forEach(card => {
      card.addEventListener('click', () => enterScene(card.dataset.scene));
    });

    // 返回首页
    document.getElementById('backHome').addEventListener('click', backToHome);
  </script>
</body>

</html>
